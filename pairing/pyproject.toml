[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pairing"
version = "0.1.0"
description = "Geo slot ↔ camera calib bbox pairing"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
]

[tool.setuptools.packages.find]
include = ["pairing*"]
