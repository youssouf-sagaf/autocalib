# SCAFFOLD — Deploy production (main → VM :8000)
# Disabled until secrets + GHCR + VM are configured.
# To activate: uncomment push + configure GitHub environment "production".
# See docs/deploy/README.md

name: Deploy production

on:
  workflow_dispatch:
  # SCAFFOLD — enable after staging validated:
  # push:
  #   branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build, push, deploy production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=prod-,format=short
            type=raw,value=prod-latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }}
            VITE_API_URL=
            VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
            VITE_AUTH_DOMAIN=${{ secrets.VITE_AUTH_DOMAIN }}
            VITE_DATABASE_URL=${{ secrets.VITE_DATABASE_URL }}
            VITE_PROJECT_ID=${{ secrets.VITE_PROJECT_ID }}
            VITE_STORAGE_BUCKET=${{ secrets.VITE_STORAGE_BUCKET }}
            VITE_MESSAGING_SENDER_ID=${{ secrets.VITE_MESSAGING_SENDER_ID }}
            VITE_ID=${{ secrets.VITE_ID }}
            VITE_MEASUREMENT_ID=${{ secrets.VITE_MEASUREMENT_ID }}
            VITE_B2B_BASE_URL=${{ secrets.VITE_B2B_BASE_URL }}

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ${{ vars.VM_DEPLOY_PATH || '~/autocalib' }}
            export IMAGE_TAG=prod-$(echo "${{ github.sha }}" | cut -c1-7)
            export GHCR_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            chmod +x scripts/deploy-vm.sh
            ./scripts/deploy-vm.sh prod

      - name: Smoke test
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: curl -sf http://localhost:8000/health
