[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calib_gen"
version = "0.1.0"
description = "Camera calibration bbox generation (stack alignment, dedup, scope, empty-slot fill)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "numpy>=1.24",
    "opencv-python-headless>=4.5",
    "scipy>=1.7",
]

[project.optional-dependencies]
yolo = [
    "ultralytics>=8.0",
]
sam3 = [
    "torch>=2.0",
    "transformers>=5.5",
    "Pillow>=10.0",
]
s3 = [
    "boto3>=1.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["calib_gen*"]
exclude = ["calib_gen_rd*"]
